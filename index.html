<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kaisei+Decol&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Firebase設定画面 (I-9) ===== -->
<div id="setupScreen" class="setup-screen">
  <div class="setup-box">
    <div class="setup-title">GRID</div>
    <div class="setup-subtitle">FIREBASE CONFIGURATION</div>
    <div class="setup-hint">
      Firebaseコンソール → プロジェクトの設定 → マイアプリ → SDKの設定と構成<br>
      からコピーした順番で入力してください。
    </div>
    <div id="setupStatus" class="setup-status"></div>
    <div class="fl">
      <label>① API KEY</label>
      <input id="cfgApiKey" class="fi" type="text" placeholder="AIzaSy...">
    </div>
    <div class="fl">
      <label>② AUTH DOMAIN <span style="color:var(--red)">*</span></label>
      <input id="cfgAuthDomain" class="fi" type="text" placeholder="your-project.firebaseapp.com">
    </div>
    <div class="fl">
      <label>③ DATABASE URL</label>
      <input id="cfgDbUrl" class="fi" type="text" placeholder="https://your-project.firebaseio.com">
    </div>
    <div class="fl">
      <label>④ PROJECT ID</label>
      <input id="cfgProjectId" class="fi" type="text" placeholder="your-project-id">
    </div>
    <div class="fl">
      <label>⑤ APP ID</label>
      <input id="cfgAppId" class="fi" type="text" placeholder="1:123456:web:abcdef">
    </div>
    <div class="setup-acts">
      <button id="btnTest" class="btn-test" disabled>TEST CONNECTION</button>
      <button id="btnSaveConfig" class="btn-save-config" disabled>SAVE</button>
    </div>
    <span id="setupReset" class="setup-reset" style="display:none;">設定をリセット</span>
  </div>
</div>

<!-- ===== ログイン画面 (O-4) ===== -->
<div id="loginScreen" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:200; justify-content:center; align-items:center; flex-direction:column; gap:24px;">
  <div class="setup-title">GRID</div>
  <div class="setup-subtitle">SIGN IN TO CONTINUE</div>
  <div id="loginError" style="display:none; color:var(--red); font-size:13px; text-align:center;"></div>
  <button id="btnGoogleLogin" style="display:flex; align-items:center; gap:10px; padding:12px 28px; font-size:14px; font-family:inherit; background:#fff; border:1px solid #ddd; border-radius:4px; cursor:pointer; letter-spacing:0.05em;">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l6-6C34.2 3 29.4 1 24 1 14.8 1 6.9 6.5 3.3 14.3l7 5.4C12.1 13.5 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4.1 7.2-10.1 7.2-17z"/><path fill="#FBBC05" d="M10.3 28.3A14.5 14.5 0 0 1 9.5 24c0-1.5.2-2.9.6-4.3l-7-5.4A23 23 0 0 0 1 24c0 3.7.9 7.2 2.4 10.3l6.9-6z"/><path fill="#34A853" d="M24 47c5.4 0 9.9-1.8 13.2-4.8l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.4 0-11.8-4.3-13.8-10.1l-6.9 6C6.8 41.5 14.8 47 24 47z"/></svg>
    Googleでログイン
  </button>
</div>

<!-- ===== メイン画面 ===== -->
<div id="mainApp" style="display:none; height:100%; display:none; flex-direction:column;">

<!-- ヘッダー -->
<header>
  <div class="logo">GRID <span>v1.17</span></div>
  <button id="btnDone" class="hbtn">DONE</button>
  <button id="btnLogout" class="hbtn" style="margin-left:8px; font-size:11px;">LOGOUT</button>
</header>

<!-- タスク追加バー -->
<div class="addbar">
  <input id="quickInput" class="add-main-input" type="text" placeholder="新しいタスクを追加...">
  <button id="btnAdd" class="add-btn-main">ADD</button>
</div>

<!-- ナビバー -->
<div class="nav-bar">
  <div class="nav-left">
    <span class="pane-title">TASKS</span>
    <button id="btnSortByDay" class="sort-day-btn" disabled title="親とサブタスクを今日以降の一番近い予定日（●）順に整理。同日は今の順番を維持。過去の予定だけ、予定日なし、完了済みの子の順に下へ">予定日順</button>
    <span id="taskCount" class="task-count">0件</span>
  </div>
  <div class="nav-right">
    <button id="calPrev" class="cal-nav-btn">◀</button>
    <button id="calToday" class="cal-today-btn">TODAY</button>
    <button id="calNext" class="cal-nav-btn">▶</button>
    <button id="btnShiftWeek" class="sort-day-btn" disabled title="今日以降のすべての予定日（●）を7日後へ移動" aria-label="今日以降の予定を1週間後へ移動">予定＋1週</button>
    <span id="calRange" class="cal-range"></span>
  </div>
</div>

<!-- メインレイアウト -->
<div id="holidayNotice" class="holiday-notice" role="status" hidden></div>
<div class="main-layout">
  <!-- タスクペイン -->
  <div class="task-pane">
    <div class="date-head-spacer"></div>
    <div id="taskList" class="task-list-scroll"></div>
  </div>
  <!-- カレンダーペイン -->
  <div class="calendar-pane">
    <div class="date-head-wrapper">
      <div id="dateHead" class="date-head-inner"></div>
    </div>
    <div id="calScroll" class="cal-scroll">
      <div id="calInner" class="cal-inner"></div>
    </div>
  </div>
</div>

</div><!-- /mainApp -->

<!-- ===== 完了パネル (O-3) ===== -->
<div id="cpPanel" class="cp-panel">
  <div class="cp-head">
    <span class="cp-title">COMPLETED</span>
    <button id="cpClose" class="cp-close">✕</button>
  </div>
  <div id="cpList" class="cp-list"></div>
</div>

<!-- ===== 編集モーダル (I-2) ===== -->
<div id="editBg" class="modal-bg">
  <div class="modal">
    <div id="editTitle" class="modal-title">タスク編集</div>
    <div class="fl">
      <label>TASK NAME</label>
      <input id="eName" class="fi" type="text">
    </div>
    <div class="fl">
      <label>NEXT ACTION</label>
      <input id="eAction" class="fi" type="text" placeholder="具体的な動詞から記述...">
    </div>
    <div class="fl">
      <label>DEADLINE</label>
      <input id="eDeadline" class="fi" type="date">
    </div>
    <div class="fl">
      <label>COLOR</label>
      <div class="color-row">
        <div class="co c-red" data-c="red">緊急</div>
        <div class="co c-blue" data-c="blue">集中</div>
        <div class="co c-yellow" data-c="yellow">定型</div>
        <div class="co c-none" data-c="none">なし</div>
      </div>
    </div>
    <div id="eSubtaskSection" class="fl" hidden>
      <label for="eSubtaskName">サブタスク</label>
      <div id="eSubtaskList" class="edit-subtask-list"></div>
      <div class="subtask-add-row">
        <input id="eSubtaskName" class="fi" type="text" placeholder="サブタスク名を入力...">
        <button id="btnAddSubtask" class="btn-ok" type="button">追加</button>
      </div>
    </div>
    <div class="modal-acts">
      <button id="btnEditComplete" class="btn-complete">COMPLETE</button>
      <button id="btnEditSave" class="btn-ok">SAVE</button>
      <button id="btnEditDelete" class="btn-delete">DELETE</button>
      <button id="btnEditCancel" class="btn-cancel">CANCEL</button>
    </div>
  </div>
</div>

<!-- ===== 確認ダイアログ ===== -->
<div id="confBg" class="conf-bg">
  <div class="conf-box">
    <div id="confTitle" class="conf-title"></div>
    <div id="confMsg" class="conf-msg"></div>
    <div id="confActs" class="conf-acts"></div>
  </div>
</div>

<!-- ===== トースト ===== -->
<div id="toast" class="toast"></div>

<!-- ===== Firebase SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

function ds(d) {  // v1.9: UTC変換ではなくローカル時間で日付文字列を生成（タイムゾーン問題対応）
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}
function flashError(el, ms = 1200) {
  el.style.borderColor = 'var(--red)';
  setTimeout(() => el.style.borderColor = '', ms);
}

/* ===== I-9: Firebase設定物語 ===== */
function loadConfig() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function validateConfig(cfg) {
  if (!cfg) return false;
  if (!cfg.apiKey || !cfg.databaseURL || !cfg.projectId) return false;
  if (!cfg.databaseURL.startsWith('https://')) return false;
  if (!cfg.authDomain) return false;  // v1.6追加
  return true;
}

function initSetup() {
  const cfg = loadConfig();
  if (cfg && validateConfig(cfg)) {
    // 設定あり・照合②適合 → P-2起動（v1.6変更）
    startAuthFlow(cfg);
    return;
  }
  // 設定なし → 設定画面表示
  setupScreen.classList.remove('hidden');
  mainApp.style.display = 'none';
  if (cfg) {
    // 設定はあるが不正
    $('cfgApiKey').value = cfg.apiKey || '';
    $('cfgDbUrl').value = cfg.databaseURL || '';
    $('cfgProjectId').value = cfg.projectId || '';
    $('cfgAppId').value = cfg.appId || '';
    $('cfgAuthDomain').value = cfg.authDomain || '';
    $('setupReset').style.display = '';
  }
}

// 入力変更時にテストボタン活性制御（v1.6: cfgAuthDomain追加）
['cfgApiKey','cfgAuthDomain','cfgDbUrl','cfgProjectId','cfgAppId'].forEach(id => {  // v1.9: Firebaseコンソールのコピー順
  $(id).addEventListener('input', () => {
    const ok = $('cfgApiKey').value.trim() && $('cfgDbUrl').value.trim()
      && $('cfgProjectId').value.trim()
      && $('cfgDbUrl').value.trim().startsWith('https://')
      && $('cfgAuthDomain').value.trim();
    $('btnTest').disabled = !ok;
    $('btnSaveConfig').disabled = true;
    $('setupStatus').className = 'setup-status';
    $('setupStatus').textContent = '';
  });
});

// 接続テスト
$('btnTest').addEventListener('click', async () => {
  const cfg = {
    apiKey: $('cfgApiKey').value.trim(),
    databaseURL: $('cfgDbUrl').value.trim(),
    projectId: $('cfgProjectId').value.trim(),
    appId: $('cfgAppId').value.trim(),
    authDomain: $('cfgAuthDomain').value.trim()  // v1.6追加
  };
  if (!validateConfig(cfg)) return;

  $('btnTest').disabled = true;
  $('setupStatus').className = 'setup-status';
  $('setupStatus').textContent = 'テスト中...';
  $('setupStatus').style.display = 'block';

  try {
    // 既存のappがあれば削除
    if (firebase.apps.length) await firebase.app().delete();
    const app = firebase.initializeApp(cfg);
    const testDb = firebase.database(app);
    // 接続テスト: grid/ にアクセス（10秒タイムアウト）
    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('接続がタイムアウトしました（10秒）')), 10000)
    );
    await Promise.race([testDb.ref('.info/connected').once('value'), timeout]);
    $('setupStatus').className = 'setup-status success';
    $('setupStatus').textContent = '接続成功';
    $('btnSaveConfig').disabled = false;
  } catch (e) {
    $('setupStatus').className = 'setup-status error';
    $('setupStatus').textContent = 'エラー: ' + e.message;
    $('btnSaveConfig').disabled = true;
    // テスト失敗時はappをクリーンアップ
    try { if (firebase.apps.length) await firebase.app().delete(); } catch(_){}
  } finally {
    $('btnTest').disabled = false;
  }
});

// 保存（v1.6: authDomain追加・startAuthFlow起動へ変更）
$('btnSaveConfig').addEventListener('click', () => {
  const cfg = {
    apiKey: $('cfgApiKey').value.trim(),
    databaseURL: $('cfgDbUrl').value.trim(),
    projectId: $('cfgProjectId').value.trim(),
    appId: $('cfgAppId').value.trim(),
    authDomain: $('cfgAuthDomain').value.trim()
  };
  localStorage.setItem(LS_KEY, JSON.stringify(cfg));
  startAuthFlow(cfg);
});

// リセット
$('setupReset').addEventListener('click', () => {
  localStorage.removeItem(LS_KEY);
  $('cfgApiKey').value = '';
  $('cfgDbUrl').value = '';
  $('cfgProjectId').value = '';
  $('cfgAppId').value = '';
  $('cfgAuthDomain').value = '';
  $('btnTest').disabled = true;
  $('btnSaveConfig').disabled = true;
  $('setupStatus').className = 'setup-status';
  $('setupStatus').textContent = '';
  $('setupReset').style.display = 'none';
});

/* ===== P-2: 認証フロー管理物語 (v1.6新規) ===== */
function startAuthFlow(cfg) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    // I-10: 認証初期化
    auth = firebase.auth();
    // I-12: 認証ガード（onAuthStateChangedで状態監視）
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        // 認証済み → P-1起動・メイン画面へ
        loginScreen.style.display = 'none';
        startDB();
        setupScreen.classList.add('hidden');
        mainApp.style.display = 'flex';
        $('setupReset').style.display = '';
      } else {
        // 未認証 → O-4表示・I-11呼び出し
        mainApp.style.display = 'none';
        setupScreen.classList.add('hidden');
        loginScreen.style.display = 'flex';
      }
    });
  } catch (e) {
    console.error('Auth flow error:', e);

/* ===== P-1: Firebase同期物語 ===== */
function startDB() {
  if (db) return;  // 二重起動防止
  db = firebase.database();
  syncScroll();  // v1.7: 起動時に一度だけ登録
  db.ref('grid/tasks').on('value', snap => {
    const val = snap.val();
    tasks = Array.isArray(val) ? val : [];
    tasks.forEach(t => {
      if (!Array.isArray(t.days)) t.days = [];
      if (t.origIdx === undefined || t.origIdx === null) t.origIdx = -1;
    });
    render();
  });
  db.ref('grid/done').on('value', snap => {
    const val = snap.val();
    done = Array.isArray(val) ? val : [];
    if (cpPanel.classList.contains('open')) renderCP();
  });
}

function save() {
  if (!db || !currentUser) return;  // v1.6: 認証済みチェック追加
  Promise.all([
    db.ref('grid/tasks').set(tasks),
    db.ref('grid/done').set(done)
  ]).catch(e => showToast('保存に失敗しました'));  // v1.7: コンソール出力→トースト表示
}

function openEdit(id, parentId = null) {

async function saveEdit() {

/* ===== I-3: タスク完了物語 ===== */
function completeTask(id) {
  if (subtaskSaving) return;
  const idx = tasks.findIndex(t => t.id === id);
  if (idx < 0) return;
  const t = tasks[idx];
  const children = subtasksOf(t);
  if (children.length) {
    const pending = children.filter(c => !c.completedAt).length;
    if (pending) {
      showConfirm('サブタスクが未完了です', `未完了のサブタスクが${pending}件あります。親タスクを完了しますか？`, [
        { label: '親を完了', cls: 'btn-complete', fn: () => { closeConfirm(); doComplete(tasks.findIndex(x => x.id === id)); } },
        { label: 'CANCEL', cls: 'btn-cancel', fn: closeConfirm }
      ]);
    } else doComplete(idx);
    return;
  }
  if (!t.action || !t.action.trim()) {
    showConfirm('Next Action未入力', 'Next Actionが未入力です。このまま完了しますか？', [
      { label: 'このまま完了', cls: 'btn-complete', fn: () => { closeConfirm(); doComplete(idx); } },
      { label: 'Actionを入力', cls: 'btn-ok', fn: () => { closeConfirm(); openEdit(id); } }
    ]);
    return;
  }
  doComplete(idx);
}

function doComplete(idx) {
  if (idx < 0 || idx >= tasks.length) return;
  const t = tasks[idx];
  t.completedAt = new Date().toISOString();
  t.origIdx = idx;
  done.unshift(t);
  tasks.splice(idx, 1);
  save();
  render();
  if (cpPanel.classList.contains('open')) renderCP();
  showToast('完了しました 🎉');
}

  else completeTask(editId);
});

/* ===== 親タスク・サブタスク ===== */
function nextTaskId() {
  lastTaskId = Math.max(Date.now(), lastTaskId + 1);
  return lastTaskId;
}

function subtasksOf(task) {
  return Array.isArray(task.subtasks) ? task.subtasks : [];
}

function scheduledDaysForTask(task) {
  const children = subtasksOf(task);
  return children.length
    ? children.filter(c => !c.completedAt).flatMap(c => Array.isArray(c.days) ? c.days : [])
    : task.days;
}

function nextSubtask(task, today = ds(new Date())) {
  let next = null;
  for (const child of subtasksOf(task)) {
    if (child.completedAt) continue;
    const day = earliestScheduledDay(child, today);
    if (day && (!next || day < next.day)) next = { child, day };
  }
  return next;
}

function visibleTaskRows() {
  return tasks.flatMap((task, rootIndex) => {
    const rows = [{ task, rootIndex, childId: null }];
    if (expandedTaskIds.has(task.id)) {
      subtasksOf(task).forEach(child => rows.push({ task: child, rootIndex, childId: child.id }));
    }
    return rows;
  });
}

function toggleSubtasks(id) {
  if (expandedTaskIds.has(id)) expandedTaskIds.delete(id);
  else expandedTaskIds.add(id);
  render();
}

function renderSubtaskSection() {
  const parent = editParentId === null ? tasks.find(t => t.id === editId) : null;
  $('eSubtaskSection').hidden = !parent;
  if (!parent) return;
  $('eSubtaskList').innerHTML = subtasksOf(parent).map(c =>
    `<div class="edit-subtask-item${c.completedAt ? ' completed' : ''}">${c.completedAt ? '✓' : '○'} ${esc(c.name)}</div>`
  ).join('');
  $('btnAddSubtask').disabled = subtaskSaving;
}

async function commitSubtaskChange(parentId, updateParent, message) {
  if (!db || !currentUser || subtaskSaving || shiftingDays || sortingByDay) return false;
  subtaskSaving = true;
  $('btnEditSave').disabled = true;
  renderTasks();
  renderSubtaskSection();
  try {
    const result = await db.ref('grid/tasks').transaction(current => {
      if (!Array.isArray(current)) return;
      const index = current.findIndex(t => t && t.id === parentId);
      if (index < 0) return;
      const parent = updateParent(current[index]);
      if (!parent) return;
      return current.map((t, i) => i === index ? parent : t);
    }, undefined, false);
    if (!result.committed) { showToast('対象のタスクが更新されています。もう一度確認してください'); return false; }
    tasks = result.snapshot.val();
    render();
    renderSubtaskSection();
    showToast(message);
    return true;
  } catch (e) {
    showToast('サブタスクの変更を保存できませんでした');
    return false;
  } finally {
    subtaskSaving = false;
    $('btnEditSave').disabled = false;
    renderTasks();
    renderSubtaskSection();
  }
}

async function addSubtask() {
  if (editParentId !== null || editId === null || subtaskSaving) return;
  const name = $('eSubtaskName').value.trim();
  if (!name) { flashError($('eSubtaskName')); return; }
  const parentId = editId;
  const child = { id: nextTaskId(), name, action: '', deadline: '', color: 'none', days: [], createdAt: new Date().toISOString() };
  const ok = await commitSubtaskChange(parentId, parent => ({ ...parent, subtasks: [...subtasksOf(parent), child] }), 'サブタスクを追加しました');
  if (ok) {
    expandedTaskIds.add(parentId);
    if (editId === parentId && editParentId === null) $('eSubtaskName').value = '';
    render();
  }
}

async function toggleSubtaskComplete(parentId, childId) {
  const completedAt = new Date().toISOString();
  await commitSubtaskChange(parentId, parent => {
    if (!subtasksOf(parent).some(c => c.id === childId)) return;
    return { ...parent, subtasks: subtasksOf(parent).map(c => {
      if (c.id !== childId) return c;
      const child = { ...c };
      if (child.completedAt) delete child.completedAt;
      else child.completedAt = completedAt;
      return child;
    }) };
  }, 'サブタスクの完了状態を保存しました');
}

function deleteSubtask(parentId, childId) {
  const parent = tasks.find(t => t.id === parentId);
  const child = parent && subtasksOf(parent).find(c => c.id === childId);
  if (!child || subtaskSaving) return;
  showConfirm('サブタスク削除', `「${child.name}」を削除しますか？`, [
    { label: 'DELETE', cls: 'btn-delete', fn: () => {
      closeConfirm();
      commitSubtaskChange(parentId, p => {
        if (!subtasksOf(p).some(c => c.id === childId)) return;
        return { ...p, subtasks: subtasksOf(p).filter(c => c.id !== childId) };
      }, 'サブタスクを削除しました');
    } },
    { label: 'CANCEL', cls: 'btn-cancel', fn: closeConfirm }
  ]);
}

/* ===== I-14: 予定日順並び替え物語 (v1.13) ===== */
// 複数の予定日も今日以降だけで比較する。過去の●自体は保持する。
function earliestScheduledDay(task, fromDay = '') {
  if (!Array.isArray(task.days)) return '';
  return task.days.reduce((nearest, day) => {
    if (typeof day !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(day) || day < fromDay) return nearest;
    const date = new Date(day + 'T00:00:00');
    if (Number.isNaN(date.getTime()) || ds(date) !== day) return nearest;
    return !nearest || day < nearest ? day : nearest;
  }, '');
}

function sortScheduleList(list, today, isChild = false) {
  return list.map((task, index) => {
    const schedule = isChild ? task : { days: scheduledDaysForTask(task) };
    const day = earliestScheduledDay(schedule, today);
    // 今後の予定あり → 過去の予定だけ → 有効な予定日なし → 完了済みの子。
    const group = isChild && task.completedAt ? 3 : day ? 0 : earliestScheduledDay(schedule) ? 1 : 2;
    return { task, index, day: group === 0 ? day : '', group };
  })
    .sort((a, b) => {
      if (a.group !== b.group) return a.group - b.group;
      if (a.day !== b.day) return a.day < b.day ? -1 : 1;
      return a.index - b.index;
    }).map(item => item.task);
}

async function sortByScheduledDay() {
  if (!db || !currentUser || sortingByDay || shiftingDays || subtaskSaving || !tasks.length) return;
  const today = ds(new Date());
  const sorted = sortScheduleList(tasks.map(task => {
    const children = subtasksOf(task);
    if (children.length < 2) return task;
    const subtasks = sortScheduleList(children, today, true);
    return subtasks.every((child, index) => child === children[index]) ? task : { ...task, subtasks };
  }), today);
  if (sorted.every((task, index) => task === tasks[index])) {
    showToast('予定日順に並んでいます');
    return;
  }

  sortingByDay = true;
  $('btnSortByDay').disabled = true;
  tasks = sorted;
  render();
  try {
    // 並び順だけの変更なので、完了タスクには書き込まない。
    await db.ref('grid/tasks').set(sorted);
    showToast('予定日順に並び替えました');
  } catch (e) {
    showToast('並び替えの保存に失敗しました');
  } finally {
    sortingByDay = false;
    renderTasks();
  }
}

$('btnSortByDay').addEventListener('click', sortByScheduledDay);

/* ===== 今日以降の予定を1週間移動 ===== */
function planUpcomingWeekShift(list, fromDay) {
  const changes = [];
  function shiftOne(task, parent = null) {
    if (!Array.isArray(task.days)) return task;
    const days = task.days.map(day => {
      if (!earliestScheduledDay({ days: [day] }, fromDay)) return day;
      const date = new Date(day + 'T12:00:00');
      date.setDate(date.getDate() + 7);
      const to = ds(date);
      changes.push({ id: task.id, ...(parent ? { parentId: parent.id } : {}), name: parent ? `${parent.name} / ${task.name}` : task.name, from: day, to });
      return to;
    });
    return days.some((day, i) => day !== task.days[i]) ? { ...task, days } : task;
  }
  const shifted = list.map(task => {
    const children = subtasksOf(task);
    if (!children.length) return shiftOne(task);
    const subtasks = children.map(c => c.completedAt ? c : shiftOne(c, task));
    return subtasks.some((c, i) => c !== children[i]) ? { ...task, subtasks } : task;
  });
  return { tasks: shifted, changes };
}

function upcomingShiftKey(changes) {
  // 名前等の変更は保ちつつ、確認後に予定日や並びが変わったら再確認する。
  return JSON.stringify(changes.map(({ parentId = null, id, from, to }) => [parentId, id, from, to]));
}

function confirmUpcomingWeekShift() {
  if (!db || !currentUser || shiftingDays || sortingByDay || subtaskSaving) return;
  const today = ds(new Date());
  const plan = planUpcomingWeekShift(tasks, today);
  if (!plan.changes.length) { showToast('今日以降の予定日（●）はありません'); return; }
  const details = plan.changes.map(c => `${c.name}：${c.from} → ${c.to}`).join('\n');
  showConfirm('予定を1週間後へ移動', `今日（${today}）以降の予定日（●）${plan.changes.length}件を7日後へ移します。\n過去の●と期限（▲）は変更しません。\n\n${details}`, [
    { label: '7日後へ移動', cls: 'btn-ok', fn: () => {
      closeConfirm();
      shiftUpcomingWeek(today, upcomingShiftKey(plan.changes));
    } },
    { label: 'CANCEL', cls: 'btn-cancel', fn: closeConfirm }
  ]);
}

async function shiftUpcomingWeek(today, confirmedKey) {
  if (!db || !currentUser || shiftingDays || sortingByDay || subtaskSaving) return;
  shiftingDays = true;
  renderTasks();
  try {
    // 最新データから一括更新する。保存まで元の予定を保持し、重複を作らない。
    const result = await db.ref('grid/tasks').transaction(current => {
      if (!Array.isArray(current) || current.some(task => !task || typeof task !== 'object')) return;
      const plan = planUpcomingWeekShift(current, today);
      if (!plan.changes.length || upcomingShiftKey(plan.changes) !== confirmedKey) return;
      return plan.tasks;
    }, undefined, false);
    if (!result.committed) {
      showToast('予定が更新されています。もう一度確認してください');
      return;
    }
    tasks = result.snapshot.val();
    render();
    const count = JSON.parse(confirmedKey).length;
    showToast(`予定${count}件を7日後へ移動しました`);
  } catch (e) {
    showToast('予定の移動を保存できませんでした');
  } finally {
    shiftingDays = false;
    renderTasks();
  }
}

$('btnShiftWeek').addEventListener('click', confirmUpcomingWeekShift);

/* ===== I-5: 手動並び替え ===== */
// PC ドラッグ&ドロップ
function onDragStart(e, idx) {
  if (subtaskSaving || shiftingDays) { e.preventDefault(); return; }
  dragSrcIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.target.closest('.task-row').classList.add('dragging');
}
function onDragOver(e) { e.preventDefault(); }
function onDragEnter(e) {
  const row = e.target.closest('.task-row');
  if (row) row.classList.add('drag-over');
}
function onDragLeave(e) {
  const row = e.target.closest('.task-row');
  if (row) row.classList.remove('drag-over');
}
function onDrop(e, targetIdx) {
  e.preventDefault();
  if (subtaskSaving || shiftingDays) return;
  document.querySelectorAll('.task-row').forEach(r => r.classList.remove('drag-over','dragging'));
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
  if (targetIdx < 0 || targetIdx >= tasks.length) return;
  const moved = tasks.splice(dragSrcIdx, 1)[0];
  tasks.splice(targetIdx, 0, moved);
  dragSrcIdx = null;
  save();
  render();
}

// スマホ タッチドラッグ
let touchDragIdx = null;
let touchClone = null;
let touchOverIdx = null;

function onTouchDragStart(e, idx) {
  if (subtaskSaving || shiftingDays) return;
  e.preventDefault();
  touchDragIdx = idx;
  const row = e.target.closest('.task-row');
  row.classList.add('touch-dragging');
  touchClone = row.cloneNode(true);
  touchClone.style.position = 'fixed';
  touchClone.style.pointerEvents = 'none';
  touchClone.style.opacity = '0.7';
  touchClone.style.zIndex = '1000';
  touchClone.style.width = row.offsetWidth + 'px';
  document.body.appendChild(touchClone);
  const touch = e.touches[0];
  touchClone.style.left = '0px';
  touchClone.style.top = touch.clientY - 26 + 'px';
}

function onTouchDragMove(e) {
  if (touchDragIdx === null) return;
  e.preventDefault();
  const touch = e.touches[0];
  if (touchClone) touchClone.style.top = touch.clientY - 26 + 'px';
  // ホバー対象の特定
  document.querySelectorAll('.task-row').forEach(r => r.classList.remove('touch-drag-over'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (el) {
    const row = el.closest('.task-row');
    if (row && row.dataset.idx !== undefined) {
      row.classList.add('touch-drag-over');
      touchOverIdx = parseInt(row.dataset.idx);
    }
  }
}

function onTouchDragEnd(e) {
  if (touchDragIdx === null) return;
  document.querySelectorAll('.task-row').forEach(r => r.classList.remove('touch-dragging','touch-drag-over'));
  if (touchClone) { touchClone.remove(); touchClone = null; }
  if (touchOverIdx !== null && touchDragIdx !== touchOverIdx) {
    if (touchOverIdx >= 0 && touchOverIdx < tasks.length) {
      const moved = tasks.splice(touchDragIdx, 1)[0];
      tasks.splice(touchOverIdx, 0, moved);
      save();
      render();
    }
  }
  touchDragIdx = null;
  touchOverIdx = null;
}

document.addEventListener('touchmove', onTouchDragMove, { passive: false });
document.addEventListener('touchend', onTouchDragEnd);

/* ===== I-6: カレンダードット操作物語 ===== */
let dotDragSrc = null;

function calendarTask(ti, childId = null) {
  const parent = tasks[ti];
  if (!parent) return null;
  return childId === null ? parent : subtasksOf(parent).find(c => c.id === childId);
}

async function toggleDot(ti, dateStr, childId = null) {
  if (subtaskSaving || shiftingDays || ti < 0 || ti >= tasks.length) return;
  if (!earliestScheduledDay({ days: [dateStr] })) return;
  const task = calendarTask(ti, childId);
  if (!task) return;
  if (childId === null && subtasksOf(task).length) {
    expandedTaskIds.add(task.id);
    render();
    showToast('サブタスクの行で予定日を変更できます');
    return;
  }
  if (childId !== null) {
    if (task.completedAt) return;
    await commitSubtaskChange(tasks[ti].id, parent => {
      const child = subtasksOf(parent).find(c => c.id === childId);
      if (!child || child.completedAt) return;
      const days = Array.isArray(child.days) ? child.days : [];
      const updated = days.includes(dateStr) ? days.filter(day => day !== dateStr) : [...days, dateStr];
      return { ...parent, subtasks: subtasksOf(parent).map(c => c.id === childId ? { ...c, days: updated } : c) };
    }, 'サブタスクの予定日を保存しました');
    return;
  }
  if (!Array.isArray(task.days)) task.days = [];
  const di = task.days.indexOf(dateStr);
  if (di >= 0) {
    task.days.splice(di, 1);
  } else {
    task.days.push(dateStr);
  }
  save();
  renderCal();
}

function dotDragStart(ti, dateStr, e, childId = null) {
  if (subtaskSaving || shiftingDays) { e.preventDefault(); return; }
  dotDragSrc = { ti, childId, ds: dateStr };
  e.dataTransfer.effectAllowed = 'move';
}

function dotDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

async function dotDrop(ti, dateStr, e, childId = null) {
  e.preventDefault();
  if (!dotDragSrc || subtaskSaving || shiftingDays) return;
  if (dotDragSrc.ti !== ti || dotDragSrc.childId !== childId || dotDragSrc.ds === dateStr) {
    dotDragSrc = null;
    return;
  }
  const from = dotDragSrc.ds;
  dotDragSrc = null;
  if (childId !== null) {
    const parent = tasks[ti];
    if (!parent || !earliestScheduledDay({ days: [dateStr] })) return;
    await commitSubtaskChange(parent.id, p => {
      const child = subtasksOf(p).find(c => c.id === childId);
      if (!child || child.completedAt || !Array.isArray(child.days) || !child.days.includes(from)) return;
      const days = [...child.days.filter(day => day !== from && day !== dateStr), dateStr];
      return { ...p, subtasks: subtasksOf(p).map(c => c.id === childId ? { ...c, days } : c) };
    }, 'サブタスクの予定日を移動しました');
    return;
  }
  const task = tasks[ti];
  if (!task || subtasksOf(task).length) return;
  if (!Array.isArray(task.days)) task.days = [];
  const fromIdx = task.days.indexOf(from);
  if (fromIdx !== -1) task.days.splice(fromIdx, 1);
  if (!task.days.includes(dateStr)) task.days.push(dateStr);
  save();
  renderCal();
}

/* ===== I-7: 完了タスク復元物語 ===== */
function restoreTop(ci) {
  if (ci < 0 || ci >= done.length) return;
  const t = done.splice(ci, 1)[0];
  delete t.completedAt;
  tasks.unshift(t);
  save();
  render();
  renderCP();
  showToast('先頭に戻しました');
}

function restorePos(ci) {
  if (ci < 0 || ci >= done.length) return;
  const t = done.splice(ci, 1)[0];
  delete t.completedAt;
  const pos = (typeof t.origIdx === 'number' && t.origIdx >= 0 && t.origIdx <= tasks.length) ? t.origIdx : tasks.length;
  tasks.splice(pos, 0, t);
  save();
  render();
  renderCP();
  showToast('元の位置に戻しました');
}

/* ===== I-8: 完了タスク削除物語 ===== */
function deleteDone(ci) {
  if (ci < 0 || ci >= done.length) return;
  showConfirm('完了タスク削除', `「${done[ci].name}」を完全に削除しますか？`, [
    { label: 'DELETE', cls: 'btn-delete', fn: () => {
      closeConfirm();
      done.splice(ci, 1);
      save();
      renderCP();
      showToast('削除しました');
    }},
    { label: 'CANCEL', cls: 'btn-cancel', fn: closeConfirm }
  ]);
}

/* ===== 確認ダイアログ ===== */
function showConfirm(title, msg, buttons) {
  $('confTitle').textContent = title;
  $('confMsg').textContent = msg;
  const acts = $('confActs');
  acts.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.className = b.cls;
    btn.style.flex = '1';
    btn.addEventListener('click', b.fn);
    acts.appendChild(btn);
  });
  confBg.classList.add('open');
}

function closeConfirm() {
  confBg.classList.remove('open');
}

/* ===== 完了パネル (O-3) ===== */
$('btnDone').addEventListener('click', () => {
  cpPanel.classList.toggle('open');
  if (cpPanel.classList.contains('open')) renderCP();
});
$('cpClose').addEventListener('click', () => cpPanel.classList.remove('open'));

function renderCP() {
  if (!done.length) {
    cpList.innerHTML = '<div class="empty-msg">完了タスクなし</div>';
    return;
  }
  cpList.innerHTML = done.map((t, i) => `
    <div class="cp-item">
      <div class="cp-item-body">
        <div class="cp-item-name">${esc(t.name)}</div>
        <div class="cp-item-date">${t.completedAt ? fmtDate(t.completedAt) : ''}</div>
      </div>
      <div class="cp-btns">
        <button class="cp-btn top" onclick="restoreTop(${i})">↑先頭</button>
        <button class="cp-btn pos" onclick="restorePos(${i})">↩元位置</button>
        <button class="cp-btn xdel" onclick="deleteDone(${i})">✕</button>
      </div>
    </div>
  `).join('');
}

/* ===== O-1: タスクリスト表示物語 ===== */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

function parentNextLabel(task) {
  const children = subtasksOf(task);
  const pending = children.filter(c => !c.completedAt);
  if (!pending.length) return 'サブタスクはすべて完了';
  const next = nextSubtask(task);
  if (next) return `次：${Number(next.day.slice(5, 7))}/${Number(next.day.slice(8))} ${next.child.name}`;
  return earliestScheduledDay({ days: scheduledDaysForTask(task) }) ? 'リスケ待ち（過去の予定のみ）' : '予定なし';
}

function renderTasks() {
  taskCount.textContent = tasks.length + '件';
  const busy = sortingByDay || shiftingDays || subtaskSaving;
  $('btnSortByDay').disabled = !currentUser || busy || !tasks.length;
  $('btnShiftWeek').disabled = !currentUser || busy || !tasks.length;
  if (!tasks.length) {
    taskList.innerHTML = '<div class="empty-msg">タスクを追加してください</div>';
    return;
  }
  taskList.innerHTML = visibleTaskRows().map(({ task: t, rootIndex: i, childId }) => {
    const isChild = childId !== null;
    const children = isChild ? [] : subtasksOf(t);
    const completed = isChild && !!t.completedAt;
    const cc = t.color && t.color !== 'none' ? `color-${t.color}` : '';
    const sc = t.color && t.color !== 'none' ? `strip-${t.color}` : 'strip-none';
    const summary = children.length ? parentNextLabel(t) : t.action && t.action.trim() ? `▶${t.action}` : '未設定';
    const actionHtml = `<span class="task-sub${children.length ? ' parent-next' : ''}" title="${escAttr(summary)}">${esc(summary)}</span>`;
    const rowAttrs = isChild ? `data-parent-id="${tasks[i].id}"`
      : `data-idx="${i}" draggable="true" ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event)" ondragenter="onDragEnter(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${i})"`;
    const expandButton = children.length ? `<button class="subtask-toggle" onclick="toggleSubtasks(${t.id})" aria-expanded="${expandedTaskIds.has(t.id)}" aria-label="${escAttr(t.name)}のサブタスクを${expandedTaskIds.has(t.id) ? '閉じる' : '開く'}">${expandedTaskIds.has(t.id) ? '▼' : '▶'}</button>` : '';
    const editArgs = isChild ? `${t.id},${tasks[i].id}` : `${t.id}`;
    const number = isChild ? completed ? '完了' : 'サブタスク' : `#${i + 1}${children.length ? ' · 完了 ' + children.filter(c => c.completedAt).length + '/' + children.length : ''}`;
    return `<div class="task-row ${cc}${isChild ? ' subtask-row' : ''}${completed ? ' subtask-completed' : ''}" ${rowAttrs} data-id="${t.id}">
      ${isChild ? `<input type="checkbox" class="subtask-check" ${completed ? 'checked' : ''} ${busy ? 'disabled' : ''} onchange="toggleSubtaskComplete(${tasks[i].id},${t.id})" aria-label="${escAttr(t.name)}の完了">` : `<div class="drag-handle" ontouchstart="onTouchDragStart(event,${i})">⠿</div>`}
      <div class="color-strip ${sc}"></div>
      <div class="task-body">
        <span class="task-num">${number}</span>
        <div class="task-title-line">${expandButton}<span class="task-name" title="${escAttr(t.name)}">${esc(t.name)}</span></div>
        ${actionHtml}
      </div>
      <div class="task-btns">
        ${isChild ? '' : `<button class="tbtn done" onclick="completeTask(${t.id})" title="完了" ${busy ? 'disabled' : ''}>✓</button>`}
        <button class="tbtn" onclick="openEdit(${editArgs})" title="${isChild ? 'サブタスク編集' : '編集'}" aria-label="${escAttr(t.name)}を編集" ${busy ? 'disabled' : ''}>✎</button>
        ${isChild ? '' : `<button class="tbtn del" onclick="deleteTask(${t.id})" title="削除" ${busy ? 'disabled' : ''}>✕</button>`}
      </div>
    </div>`;
  }).join('');
}

/* ===== O-2: カレンダー表示物語 ===== */
function renderCal() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(start.getDate() + calOff);

  const dates = [];
  for (let i = 0; i < CAL_DAYS; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    dates.push(d);
  }

  // カレンダー範囲表示
  const s = dates[0], e = dates[dates.length - 1];
  calRange.textContent = `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`;
  const unknownYears = [...new Set(dates.map(d => d.getFullYear()))]
    .filter(y => y < JP_HOLIDAY_DATA.firstYear || y > JP_HOLIDAY_DATA.lastYear);
  $('holidayNotice').hidden = !unknownYears.length;
  $('holidayNotice').textContent = unknownYears.length
    ? `${unknownYears.map(y => y + '年').join('・')}の祝日データは未収録です。` : '';

  // ヘッダー
  const wdays = ['日','月','火','水','木','金','土'];
  dateHead.innerHTML = dates.map(d => {
    const dStr = ds(d);
    const isToday = ds(d) === ds(today);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const holidayName = JP_HOLIDAYS.get(dStr);
    let cls = 'cal-day-cell';
    if (isToday) cls += ' today-col';
    else if (isWeekend) cls += ' weekend';
    if (holidayName) cls += ' holiday';

    // 月初 or 表示開始日に月ラベル
    const showMonth = d.getDate() === 1 || d === dates[0];
    const label = showMonth
      ? `<span class="mo">${d.getMonth()+1}月</span>`
      : `<span class="dn">${d.getDate()}</span>`;

    const dayLabel = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${wdays[d.getDay()]}）${holidayName ? ' ' + holidayName : ''}${isToday ? ' 今日' : ''}`;
    const attrLabel = esc(dayLabel).replace(/"/g, '&quot;');
    return `<div class="${cls}" data-date="${dStr}" title="${attrLabel}" aria-label="${attrLabel}">${label}<span style="font-size:8px;">${wdays[d.getDay()]}${holidayName ? '・祝' : ''}</span></div>`;
  }).join('');

  // ボディ
  calInner.innerHTML = visibleTaskRows().map(({ task: t, rootIndex: ti, childId }) => {
    const isChild = childId !== null;
    const rollup = !isChild && subtasksOf(t).length > 0;
    const next = rollup ? nextSubtask(t, ds(today)) : null;
    const days = rollup ? next ? [next.day] : [] : Array.isArray(t.days) ? t.days : [];
    const editable = !rollup && !(isChild && t.completedAt);
    const cc = t.color && t.color !== 'none' ? `color-${t.color}` : '';
    return `<div class="cal-task-row ${cc}${isChild ? ' subtask-cal-row' : ''}${isChild && t.completedAt ? ' subtask-completed' : ''}${rollup ? ' rollup-row' : ''}" data-id="${t.id}"${isChild ? ` data-parent-id="${tasks[ti].id}"` : ''}>${dates.map(d => {
      const dStr = ds(d);
      const isToday = dStr === ds(today);
      const isHoliday = JP_HOLIDAYS.has(dStr);
      let cellCls = 'cal-cell';
      if (isToday) cellCls += ' today-col';
      if (isHoliday) cellCls += ' holiday-col';
      const hasDot = days.includes(dStr);
      const isDeadline = t.deadline === dStr;
      const dotColor = t.color && t.color !== 'none' ? `dot-${t.color}` : 'dot-none';
      let inner = '';
      if (hasDot) inner += `<div class="dot ${dotColor}"></div>`;
      if (isDeadline) inner += `<div class="deadline-tri"></div>`;
      const childArg = isChild ? `,${childId}` : '';
      const dragAttrs = hasDot && editable ? `draggable="true" ondragstart="dotDragStart(${ti},'${dStr}',event${childArg})"` : '';
      const click = editable || rollup ? `onclick="toggleDot(${ti},'${dStr}'${childArg})"` : '';
      const drop = editable ? `ondragover="dotDragOver(event)" ondrop="dotDrop(${ti},'${dStr}',event${childArg})"` : '';
      const title = rollup ? '子の予定から自動表示。開いてサブタスクの予定を変更できます。' : '';
      return `<div class="${cellCls}" data-date="${dStr}" ${dragAttrs} ${click} ${drop}${title ? ` title="${title}"` : ''}>${inner}</div>`;
    }).join('')}</div>`;
  }).join('');

  // 今日列へスクロール
  if (calOff === 0) {
    const todayIdx = dates.findIndex(d => ds(d) === ds(today));
    if (todayIdx >= 0) {
      const cellW = window.innerWidth <= 600 ? 36 : 44;
      calScroll.scrollLeft = Math.max(0, todayIdx * cellW - 100);
    }
  }
}

function syncScroll() {
  const dhWrapper = document.querySelector('.date-head-wrapper');
  let syncing = false;
  // 横スクロール連動（カレンダー本体 ↔ ヘッダー）
  calScroll.addEventListener('scroll', () => {
    dhWrapper.scrollLeft = calScroll.scrollLeft;
    // 縦スクロール連動（v1.8追加：カレンダー → タスクリスト）
    if (!syncing) {
      syncing = true;
      taskList.scrollTop = calScroll.scrollTop;
      syncing = false;
    }
  });
  // 縦スクロール連動（v1.8追加：タスクリスト → カレンダー）
  taskList.addEventListener('scroll', () => {
    if (!syncing) {
      syncing = true;
      calScroll.scrollTop = taskList.scrollTop;
      syncing = false;
    }
  });
}

/* ===== カレンダーナビゲーション ===== */
$('calPrev').addEventListener('click', () => { calOff -= 7; renderCal(); });
$('calNext').addEventListener('click', () => { calOff += 7; renderCal(); });
$('calToday').addEventListener('click', () => { calOff = 0; renderCal(); });

/* ===== 全体レンダリング ===== */
function render() {
  const top = calScroll.scrollTop || taskList.scrollTop || 0;
  const left = calScroll.scrollLeft || 0;
  renderTasks();
  renderCal();
  taskList.scrollTop = top;
  calScroll.scrollTop = top;
  calScroll.scrollLeft = left;
  document.querySelector('.date-head-wrapper').scrollLeft = left;
}

/* ===== I-13: ログアウトボタン / I-11: Googleログインボタン ===== */
$('btnLogout').addEventListener('click', logout);
$('btnGoogleLogin').addEventListener('click', googleLogin);

/* ===== ヘッダー設定リセット ===== */
// ヘッダーロゴダブルクリックで設定画面表示（開発用）
document.querySelector('.logo').addEventListener('dblclick', () => {
  setupScreen.classList.remove('hidden');
  $('setupReset').style.display = '';
  const cfg = loadConfig();
  if (cfg) {
    $('cfgApiKey').value = cfg.apiKey || '';
    $('cfgDbUrl').value = cfg.databaseURL || '';
    $('cfgProjectId').value = cfg.projectId || '';
    $('cfgAppId').value = cfg.appId || '';
    $('cfgAuthDomain').value = cfg.authDomain || '';
  }
});

/* ===== 起動 ===== */
initSetup();
</script>
